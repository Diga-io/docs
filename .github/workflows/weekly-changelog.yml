# Install this in Diga-io/docs as .github/workflows/weekly-changelog.yml
#
# Runs Tuesday afternoon, while the week's work is still on `development` and
# the release merge has not happened yet, so the draft PR is waiting for review
# before the Tuesday-night deploy.
#
# Four jobs rather than four steps, on purpose. Collecting and classifying take
# about twenty minutes between them; publishing takes seconds and is the part
# that fails on a permission or a network blip. As separate jobs each hands the
# next one its artifact, so "Re-run failed jobs" repeats only what broke and
# reuses the rest.
name: Weekly changelog draft

on:
  schedule:
    - cron: "0 13 * * 2" # Tuesdays 13:00 UTC — 15:00 Madrid in summer, 14:00 in winter
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the diff instead of opening a PR"
        type: boolean
        default: false

# SECURITY: this repo is public and these jobs run on a self-hosted runner.
# Keep the triggers above limited to `schedule` and `workflow_dispatch`. Never
# add `pull_request` or `pull_request_target` — a fork's PR would then execute
# its own code on the runner, with whatever that box can reach.

permissions:
  contents: write
  pull-requests: write

env:
  TOOLING_REPO: Diga-io/auto-changelog

jobs:
  # ---------------------------------------------------------------- collect --
  collect:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Diga-io/auto-changelog
          # This repo is public and the tooling repo is not, so the default
          # GITHUB_TOKEN cannot see it.
          token: ${{ secrets.CHANGELOG_GH_TOKEN }}

      - name: Check the tools this job needs
        run: |
          missing=""
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)' \
            2>/dev/null || missing="$missing python3>=3.11"
          command -v git >/dev/null || missing="$missing git"
          if ! command -v claude >/dev/null; then
            if command -v npm >/dev/null && npm install -g @anthropic-ai/claude-code; then
              echo "installed Claude Code"
            else
              missing="$missing claude"
            fi
          fi
          if [ -n "$missing" ]; then
            echo "::error::missing on this runner:$missing"
            exit 1
          fi
          echo "python $(python3 --version) | $(git --version) | claude $(claude --version)"

      - name: Check the credentials before spending twenty minutes
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set either CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY." >&2
            echo "The runner is a shared box with no logged-in Claude Code of its own." >&2
            exit 1
          fi
          # Read is not enough: the last step of the pipeline pushes a branch
          # here. Posting a ref with an unusable sha can never create anything —
          # it comes back 422 when the token may write, 403 when it may not.
          code=$(curl -s -o /tmp/write-probe.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs" \
            -d '{"ref":"refs/heads/changelog-write-probe","sha":"0000000000000000000000000000000000000000"}')
          case "$code" in
            422) echo "CHANGELOG_GH_TOKEN can write to ${{ github.repository }}" ;;
            403|404)
              echo "::error::CHANGELOG_GH_TOKEN cannot write to ${{ github.repository }}." >&2
              echo "On the fine-grained PAT, set Contents and Pull requests to Read and write." >&2
              cat /tmp/write-probe.json >&2
              exit 1 ;;
            201)
              echo "::warning::the probe ref was created; removing it"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/changelog-write-probe" ;;
            *) echo "::error::unexpected $code from the write probe" >&2
               cat /tmp/write-probe.json >&2; exit 1 ;;
          esac

      - name: Collect the window
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_GH_TOKEN }}
        run: ./changelog collect

      - uses: actions/upload-artifact@v4
        with:
          name: collected
          path: out/collect.json
          retention-days: 30

  # --------------------------------------------------------------- classify --
  classify:
    needs: collect
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Diga-io/auto-changelog
          token: ${{ secrets.CHANGELOG_GH_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: collected
          path: out

      - name: Decide what a customer would notice
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }} # optional
        run: ./changelog classify --artifact out/collect.json

      - uses: actions/upload-artifact@v4
        with:
          name: classified
          path: out/classified.json
          retention-days: 30

  # ------------------------------------------------------------------ draft --
  draft:
    needs: classify
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Diga-io/auto-changelog
          token: ${{ secrets.CHANGELOG_GH_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: classified
          path: out

      - name: Write both locales
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./changelog draft --artifact out/classified.json --no-publish

      - uses: actions/upload-artifact@v4
        with:
          name: drafted
          path: out/drafted.json
          retention-days: 30

  # ---------------------------------------------------------------- publish --
  publish:
    needs: draft
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Diga-io/auto-changelog
          token: ${{ secrets.CHANGELOG_GH_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: drafted
          path: out

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_GH_TOKEN }}
        run: |
          ./changelog publish --artifact out/drafted.json \
            ${{ inputs.dry_run && '--dry-run' || '' }}
